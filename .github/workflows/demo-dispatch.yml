name: Demo de repository_dispatch

on:
  repository_dispatch:
    types: [solicitud-cambio]

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar evento recibido
        run: |
          echo "Evento recibido desde el backend"
          echo "Tipo: ${{ github.event.client_payload.type }}"
          echo "Payload: ${{ toJson(github.event.client_payload.payload) }}"
          echo "Timestamp: ${{ github.event.client_payload.timestamp }}"
